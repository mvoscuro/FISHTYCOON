<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06323d">
<title>Maldivian Fishery Tycoon — Stage 1 (3D test build)</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
:root{
  --deep:#052b35; --lagoon:#0a6f80; --turq:#1cc8c0; --foam:#d8f6f2;
  --sand:#fff8ea; --sand2:#f3e7cd; --ink:#11343b; --mute:#5d7b80;
  --coral:#ff6a4d; --coral2:#e24f33; --gold:#f4b82e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--deep);position:relative;overflow:hidden}

/* HUD */
header{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;color:#fff;flex:none;background:linear-gradient(180deg,#0b7f90,#086374)}
.hud{display:flex;align-items:center;gap:8px}
.money{flex:1;min-width:0}
.money .big{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.05;white-space:nowrap}
.money .big small{font-size:13px;font-weight:700;color:var(--gold);margin-left:4px}
.money .rate{font-size:11.5px;color:var(--foam);opacity:.9}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.pill.boost{background:var(--coral);display:none}
.pill.boost.on{display:block}
.gear{font-size:20px;padding:4px}
.goalstrip{margin-top:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.goalstrip i{display:block;height:100%;width:0;background:var(--gold)}
.goallbl{font-size:10.5px;color:var(--foam);opacity:.85;margin-top:3px;display:flex;justify-content:space-between}

/* 3D view */
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#view{flex:1;min-height:0;position:relative;overflow:hidden;background:#8fd9ea}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(5,43,53,.86);color:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;white-space:nowrap;pointer-events:auto;border:2px solid transparent}
.tag.sel{border-color:var(--gold)}
.tag.lock{background:rgba(255,248,234,.92);color:var(--ink)}
.tag.can{background:var(--coral);color:#fff}
.tag.info{background:rgba(255,255,255,.92);color:var(--ink);pointer-events:none}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}
.coin{position:absolute;transform:translate(-50%,-100%);color:#ffe27a;font-weight:800;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;animation:coin 1.1s forwards;white-space:nowrap}
@keyframes coin{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.hint{position:absolute;left:8px;right:8px;top:8px;background:rgba(5,43,53,.78);border-radius:10px;padding:7px 10px;font-size:12.5px;color:#fff;pointer-events:none;line-height:1.35}
#glmsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink);font-weight:600;font-size:14px;line-height:1.5}

/* dock (thumb zone) */
#dock{flex:none;background:var(--deep);padding:8px 10px 8px}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chip{flex:1;background:rgba(255,255,255,.1);border-radius:12px;color:#fff;padding:6px 2px 5px;text-align:center;position:relative;border:2px solid transparent;min-width:0}
.chip.sel{background:rgba(28,200,192,.22);border-color:var(--turq)}
.chip .ci{font-size:22px;line-height:1.1}
.chip .cl{font-size:10.5px;font-weight:700;opacity:.9;white-space:nowrap}
.chip .cb{position:absolute;top:2px;right:4px;font-size:11px}
.chip.locked{opacity:.6}
.detail{background:var(--sand);border-radius:14px;padding:10px}
.dhead{display:flex;align-items:center;gap:6px}
.dhead b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.modes{margin-left:auto;display:flex;gap:4px}
.modes button{background:var(--sand2);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700}
.modes button.on{background:var(--ink);color:#fff}
.flow{font-size:11.5px;color:var(--mute);margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew{font-size:11.5px;color:var(--ink);margin:0 0 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px}
.act{flex:1;min-width:0;border-radius:12px;color:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px;justify-content:center}
.act small{font-size:10.5px;font-weight:700;opacity:.92;white-space:nowrap}
.act b{font-size:14px;white-space:nowrap}
.act.up{background:var(--coral);box-shadow:0 3px 0 var(--coral2)}
.act.hire{background:#1a9c5b;box-shadow:0 3px 0 #127443}
.act.me{background:#2c7be5;box-shadow:0 3px 0 #1c5fbd}
.act.off{background:#b9c9c4;box-shadow:none;color:var(--ink)}
.act:active{transform:translateY(2px)}
.no{filter:grayscale(.75);opacity:.55}

/* panels */
.panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 16px;display:none;background:linear-gradient(180deg,#086374,#053541);z-index:3}
.panel.on{display:block}
h2{color:#fff;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin:16px 2px 8px;opacity:.85}
.note{color:var(--foam);font-size:12.5px;opacity:.85;margin:0 2px 8px;line-height:1.4}
.row{display:flex;align-items:center;gap:10px;background:var(--sand);border-radius:14px;padding:10px;margin-bottom:8px}
.ico{font-size:28px;width:46px;height:46px;border-radius:12px;background:var(--foam);display:flex;align-items:center;justify-content:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14.5px}
.row .tx span{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.btn{flex:none;min-width:86px;background:var(--coral);color:#fff;border-radius:12px;padding:10px 8px;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 var(--coral2);text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral2)}
.btn.pearl{background:#7a5cf0;box-shadow:0 3px 0 #5a3fd0}
.btn.ad{background:#1a9c5b;box-shadow:0 3px 0 #127443}
.btn.done{background:#b9c9c4;box-shadow:none;color:var(--ink)}
.btn.wide{display:block;width:100%;padding:14px;font-size:16px;margin-top:10px}
.goalcard{background:var(--sand);border-radius:14px;padding:14px;text-align:center;margin-top:10px}
.goalcard .isl{font-size:40px}
.goalcard h3{margin:4px 0;font-size:16px}
.goalcard p{margin:0 0 8px;font-size:12.5px;color:var(--mute);line-height:1.4}

/* nav */
nav{flex:none;display:flex;background:#031f27;padding:5px 6px calc(5px + env(safe-area-inset-bottom));gap:4px}
nav button{flex:1;color:#9fc4c8;padding:6px 0 5px;border-radius:12px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button span{font-size:20px;line-height:1}
nav button.on{background:rgba(28,200,192,.16);color:#fff}
nav .dot{position:absolute;top:4px;right:24%;width:9px;height:9px;border-radius:50%;background:var(--coral);display:none}
nav button.alert .dot{display:block}

/* modal + toast */
#modal{position:absolute;inset:0;background:rgba(3,25,31,.78);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--sand);border-radius:20px;padding:22px 18px;width:100%;text-align:center}
#modal .box .e{font-size:50px}
#modal h3{margin:6px 0;font-size:20px}
#modal p{margin:0 0 6px;font-size:14px;color:var(--mute);line-height:1.45}
#modal .amt{font-size:28px;font-weight:800;margin:6px 0}
#modal .stats{text-align:left;font-size:13px;line-height:1.9;margin:10px 0}
#modal .stats b{float:right}
#toast{position:absolute;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));z-index:15;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:rgba(5,30,36,.94);color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;animation:tin 2.6s forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hud">
      <div class="money">
        <div class="big"><span id="h-mvr">0</span><small>rf</small></div>
        <div class="rate">Income <span id="h-rate">0</span> rf/s</div>
      </div>
      <div class="pill boost" id="h-boost">🌶️ x2</div>
      <div class="pill">💎 <span id="h-pearl">0</span></div>
      <button class="gear" data-a="settings" aria-label="Settings">⚙️</button>
    </div>
    <div class="goalstrip"><i id="h-goal"></i></div>
    <div class="goallbl"><span>Stage 1: Local Island</span><span id="h-goaltx"></span></div>
  </header>

  <main>
    <div id="view">
      <div id="tags"></div>
      <div class="hint" id="h-hint"></div>
      <div id="joy"><div id="knob"></div></div>
      <div id="glmsg"></div>
    </div>
    <div id="dock">
      <div class="chips" id="chips"></div>
      <div class="detail">
        <div class="dhead"><b id="d-name"></b><span class="lv" id="d-lv"></span>
          <div class="modes" id="modes"><button data-a="mode" data-v="1">x1</button><button data-a="mode" data-v="10">x10</button><button data-a="mode" data-v="max">MAX</button></div></div>
        <div class="flow" id="d-flow"></div>
        <div class="crew" id="d-crew"></div>
        <div class="acts">
          <button class="act up" data-a="up" id="d-up"><small id="d-ul"></small><b id="d-uc"></b></button>
          <button class="act hire" data-a="sup" id="d-hire"><small id="d-hl"></small><b id="d-hc"></b></button>
          <button class="act me" data-a="work" id="d-work"><small>Your fisherman</small><b id="d-wk"></b></button>
        </div>
      </div>
    </div>
    <section class="panel" id="p-upgrades"></section>
    <section class="panel" id="p-staff"></section>
    <section class="panel" id="p-shop"></section>
  </main>

  <nav>
    <button data-a="tab" data-v="island" class="on"><span>🏝️</span>Island</button>
    <button data-a="tab" data-v="upgrades"><span>🛠️</span>Upgrades<i class="dot"></i></button>
    <button data-a="tab" data-v="staff"><span>👨‍🍳</span>Staff<i class="dot"></i></button>
    <button data-a="tab" data-v="shop"><span>💎</span>Shop</button>
  </nav>

  <div id="toast"></div>
  <div id="modal"><div class="box" id="mbox"></div></div>
</div>

<script>
'use strict';
/* =====================================================================
   Maldivian Fishery Tycoon — Stage 1, 3D test build
   One file. Three.js (r149) loads from a CDN; everything else is here.
   Part 1 is the game logic (no DOM, simulated headless via __MFT).
   Part 2 is the 3D island and the interface.
   Numbers follow the Master GDD; open values are marked [TUNED].
   ===================================================================== */

/* ---------- tuning constants ---------- */
// t = GDD cycle seconds, val = rf per unit, unlock / sup = GDD costs.
// k [TUNED] stretches a visible work trip to k x t seconds and k x units, so rf/s matches the GDD.
const DEF = {
  dhoni: {n:'Dhoni Fishing',         ico:'⛵', t:3, k:3, val:10,  unlock:0,     base:60,    sup:500,   supN:'Dhoni Captain',      out:'raw tuna'},
  cut:   {n:'Cutting Station',       ico:'🔪', t:2, k:2, val:25,  unlock:100,   base:300,   sup:2000,  supN:'Fish Cutter (Kuda)', out:'clean loins'},
  smoke: {n:'Smoking (Valhoamas)',   ico:'🔥', t:4, k:2, val:120, unlock:1200,  base:2500,  sup:10000, supN:'Smoke Master',       out:'Valhoamas'},
  pot:   {n:'Simmering (Rihaakuru)', ico:'🍲', t:8, k:1, val:600, unlock:15000, base:25000, sup:50000, supN:'Rihaakuru Cook',     out:'Rihaakuru'}
};
const ORDER = ['dhoni','cut','smoke','pot'];
const GROWTH = 1.15;                 // GDD: Cost(L) = Base x 1.15^L
const MILE_STEP = 25;                // GDD: multiplier = 2^floor(L/25)
const MILE_PEARLS = 10;              // [TUNED]
const BROTH_PER_RIHA = 4;            // [TUNED] broth from 4 smoked loins per Rihaakuru jar
const VESSELS = [                    // [TUNED] rf vessel tiers
  {n:'Hand-line Dhoni',             m:1, cost:0},
  {n:'Mas Dhoni',                   m:2, cost:25000},
  {n:'Modern Pole-and-Line Vessel', m:4, cost:300000}
];
const QUALITY_COST = [20000, 250000], QUALITY_MULT = 1.5;   // [TUNED]
const SUPERVISOR = {n:'Island Supervisor', cost:150000, speed:1.25, offlineCap:2*3600};   // GDD
const ISLAND_PRICE = 500000;         // GDD Stage 1 goal
const OFFLINE_RATE = 0.5, OFFLINE_MIN = 60;                 // [TUNED]
const BOOST_SECS = 60, AD_COOLDOWN = 120;                   // [TUNED]
const SHOP = {golden:300, crate:100, crateUnits:500, warp2:50, warp24:350};   // GDD pearl prices
const BUNDLES = [[100,15],[550,75],[1200,150],[3000,350]];                    // GDD pearls / rf price
const START_PEARLS = 20, WALK_SPEED = 4.2, BOAT_SPEED = 5.5;  // [TUNED] world units per second
const HERO_WORK = 0.6;               // [TUNED] the player works a station in 60% of a staff trip (no fetching walk)
const SAVE_KEY = 'mft_stage1_3d_v2';

/* world layout (x, z). Slot 0 = hired staff, slot 1 = the player's fisherman. */
const SPOT = { dhoni:[[-6.5,-3.6],[-5.5,-3.4]], cut:[[-3.0,1.0],[-1.9,1.2]], smoke:[[1.5,0.5],[2.7,0.6]], pot:[[5.0,2.9],[6.1,2.9]] };
const SRC  = { cut:[-4.6,-1.9], smoke:[-0.5,1.9], pot:[3.9,0.9] };   // where a worker picks up input
const DOCK = [[-7.6,-9.0],[-4.4,-9.0]];
const FISH = [[-9.5,-17.5],[-2.9,-20]];
const BOARD = [-6,-9.2], SHOAL = [-1,-20], SHOAL_R = 4.2;      // step-aboard point on the jetty, the player's fishing ground
const ISLE = [0,1.5], ISLE_R = 8.8, SEA_MIN_R = 11.3;
const SOLIDS = [[2.1,-1.0,1.75],[5.5,1.9,1.0],[0.6,5.6,1.5],[4.6,6.0,1.7],[7.0,5.2,1.7],[-2.4,-1.3,0.9],[3.9,0.2,0.5]];   // things you cannot walk through
const CENTER = { dhoni:[-6,-6.5], cut:[-2.4,-0.3], smoke:[2.1,-1.0], pot:[5.5,1.6] };

/* ---------- state ---------- */
const newSlot = () => ({run:false, prog:0, batch:0});
function fresh(){
  const st = {};
  ORDER.forEach(id => st[id] = {lvl: DEF[id].unlock ? 0 : 1, auto:false, w:[newSlot(), newSlot()]});
  return {mvr:0, pearls:START_PEARLS, total:0, st, inv:{tuna:0,loin:0,broth:0},
          hx:SPOT.dhoni[1][0], hz:SPOT.dhoni[1][1], face:[0,-1], moving:false, inBoat:false, bx:DOCK[1][0], bz:DOCK[1][1], hold:0, leftDock:false, canBoard:true, fishing:false, heroZone:null,
          supervisor:false, golden:false, vessel:0, quality:0, boostUntil:0, adReadyAt:0, last:Date.now(),
          won:false, mode:'1', claimed:{}, sold:0, trips:0};
}
let S = fresh();
let now = () => Date.now();

/* ---------- formulas ---------- */
const miles    = l => Math.floor(l / MILE_STEP);
const nextMile = l => (miles(l) + 1) * MILE_STEP;
const boosted  = () => now() < S.boostUntil;
const priceMult= () => Math.pow(QUALITY_MULT, S.quality);
const unlocked = id => S.st[id].lvl > 0;
const heroOn   = id => id === 'dhoni' ? S.inBoat : S.heroZone === id;   // is the player working this station right now?
function qty(id){                       // units carried / made per work trip
  const s = S.st[id]; if (s.lvl < 1) return 0;
  let q = DEF[id].k * s.lvl * Math.pow(2, miles(s.lvl));
  if (id === 'dhoni') q *= VESSELS[S.vessel].m * (S.golden ? 2 : 1);
  return q;
}
function dur(id, noBoost){              // seconds per work trip
  return DEF[id].k * DEF[id].t / ((S.supervisor ? SUPERVISOR.speed : 1) * (!noBoost && boosted() ? 2 : 1));
}
function lvlCost(id, l){ return Math.ceil(DEF[id].base * Math.pow(GROWTH, l - 1)); }
function bulk(id){
  const s = S.st[id]; let n = 0, cost = 0;
  if (S.mode === 'max'){
    while (n < 500){ const c = lvlCost(id, s.lvl + n); if (cost + c > S.mvr) break; cost += c; n++; }
    if (n === 0){ n = 1; cost = lvlCost(id, s.lvl); }
  } else { n = +S.mode; for (let i = 0; i < n; i++) cost += lvlCost(id, s.lvl + i); }
  return {n, cost};
}
/* Steady-state income in rf/s. staffOnly = what the island earns without the player (idle / offline). */
function income(staffOnly, noBoost){
  const r = id => unlocked(id) ? qty(id) / dur(id, noBoost) * ((S.st[id].auto ? 1 : 0) + (!staffOnly && heroOn(id) ? (id === 'dhoni' ? 1 : 1 / HERO_WORK) : 0)) : 0;
  const pm = priceMult(), fish = r('dhoni');
  if (!unlocked('cut')) return fish * DEF.dhoni.val * pm;
  const cut = Math.min(fish, r('cut'));
  if (!unlocked('smoke')) return cut * DEF.cut.val * pm;
  const smk = Math.min(cut, r('smoke'));
  let inc = smk * DEF.smoke.val;
  if (unlocked('pot')) inc += Math.min(smk / BROTH_PER_RIHA, r('pot')) * DEF.pot.val;
  return inc * pm;
}

/* ---------- simulation ---------- */
function tryStart(id, slot){
  const s = S.st[id], w = s.w[slot], I = S.inv, q = qty(id);
  if (s.lvl < 1 || w.run) return false;
  let b = 0;
  if (id === 'dhoni') b = q;
  else if (id === 'cut'){ b = Math.min(q, Math.floor(I.tuna)); I.tuna -= b; }
  else if (id === 'smoke'){ b = Math.min(q, Math.floor(I.loin)); I.loin -= b; }
  else if (id === 'pot'){ b = Math.min(q, Math.floor(I.broth / BROTH_PER_RIHA)); I.broth -= b * BROTH_PER_RIHA; }
  if (b < 1) return false;
  w.batch = b; w.run = true; w.prog = 0;
  return true;
}
function sell(id, units){ const v = units * DEF[id].val * priceMult(); S.mvr += v; S.total += v; S.sold += units; onSale(v, id); }
function complete(id, slot){
  const w = S.st[id].w[slot], I = S.inv, b = w.batch;
  // goods go to the next station if it is unlocked, otherwise the local market buys them
  if (id === 'dhoni'){ S.trips++; if (unlocked('cut')) I.tuna += b; else sell('dhoni', b); }
  else if (id === 'cut'){ if (unlocked('smoke')) I.loin += b; else sell('cut', b); }
  else if (id === 'smoke'){ sell('smoke', b); if (unlocked('pot')) I.broth += b; }
  else if (id === 'pot') sell('pot', b);
  w.run = false; w.prog = 0; w.batch = 0;
}
function dist(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]); }
/* ---- the player's fisherman: walks, sails, fishes and works wherever you take him ---- */
let INP = [0, 0];
function setInput(x, z){ INP = [x, z]; }
const onFoot = (x, z) => Math.hypot(x - ISLE[0], z - ISLE[1]) <= ISLE_R || (x >= -6.7 && x <= -5.3 && z >= -9.7 && z <= -3);
const onSea  = (x, z) => Math.hypot(x - ISLE[0], z - ISLE[1]) >= SEA_MIN_R && Math.abs(x) <= 30 && z >= -34 && z <= 24;
function moveHero(dt){
  const m = Math.hypot(INP[0], INP[1]); S.moving = m > 0.1;
  if (S.moving){
    const k = Math.min(1, m) / m, ux = INP[0] * k, uz = INP[1] * k; S.face = [INP[0] / m, INP[1] / m];
    if (S.inBoat){ const sp = BOAT_SPEED * dt, nx = S.bx + ux * sp, nz = S.bz + uz * sp;
      if (onSea(nx, nz)){ S.bx = nx; S.bz = nz; } else if (onSea(nx, S.bz)) S.bx = nx; else if (onSea(S.bx, nz)) S.bz = nz; }

    [['board', BOARD, 2.6], ['shoal', SHOAL, 2.2]].forEach(a => { const v = T3.v.set(a[1][0], a[2], a[1][1]).project(T3.camera); screenPos[a[0]] = {x:(v.x * 0.5 + 0.5) * T3.W, y:(-v.y * 0.5 + 0.5) * T3.H}; });
  }

  /* ---- floating labels over the island ---- */
  const tagEl = {};
  ORDER.forEach(id => { const d = document.createElement('button'); d.className = 'tag'; d.dataset.a = 'sel'; d.dataset.v = id; $('tags').appendChild(d); tagEl[id] = d; });
  const infoTag = {}; [['board', '⛵ Board here'], ['shoal', '🎣 Fishing ground']].forEach(a => { const d = document.createElement('div'); d.className = 'tag info'; d.textContent = a[1]; $('tags').appendChild(d); infoTag[a[0]] = d; });
  const lastCoin = {};
  onSale = (v, id) => { const t = performance.now(), p = screenPos[id]; if (!p || tab !== 'island' || t - (lastCoin[id] || 0) < 500) return; lastCoin[id] = t;
    const c = document.createElement('div'); c.className = 'coin'; c.textContent = '+' + fmt(v) + ' rf'; c.style.left = p.x + 'px'; c.style.top = (p.y - 20) + 'px';
    $('tags').appendChild(c); setTimeout(() => c.remove(), 1100); };

  /* ---- dock ---- */
  $('chips').innerHTML = ORDER.map(id => '<button class="chip" data-a="sel" data-v="' + id + '" id="ch-' + id + '"><div class="ci">' + DEF[id].ico + '</div><div class="cl" id="cl-' + id + '"></div><div class="cb" id="cb-' + id + '"></div></button>').join('');
  function flow(id){
    const q = fmt(qty(id)), sells = id === 'smoke' || id === 'pot' || !unlocked(ORDER[ORDER.indexOf(id) + 1]);
    const tail = (sells ? ' · sells ' + fmt(DEF[id].val * priceMult()) + ' rf each' : '') + ' · ' + dur(id).toFixed(1) + 's trip';
    if (id === 'dhoni') return q + ' tuna per trip' + tail;
    if (id === 'cut')   return q + ' tuna → ' + q + ' loins' + tail;
    if (id === 'smoke') return q + ' loins → ' + q + ' Valhoamas' + tail;
    return fmt(qty(id) * BROTH_PER_RIHA) + ' broth → ' + q + ' jars' + tail;
  }
  function crew(id){
    const s = S.st[id], a = [];
    if (s.auto) a.push(DEF[id].supN);
    if (heroOn(id)) a.push('You');
    return a.length ? 'Working here: ' + a.join(' + ') : '⚠️ Nobody is working here';
  }

  function row(ico, title, desc, btn){ return '<div class="row"><div class="ico">' + ico + '</div><div class="tx"><b>' + title + '</b><span>' + desc + '</span></div>' + btn + '</div>'; }
  function buyBtn(a, v, cost, cur, label, cls){ return '<button class="btn ' + (cls || '') + '" data-a="' + a + '" data-v="' + v + '" data-cost="' + cost + '" data-cur="' + cur + '">' + label + '</button>'; }
  const doneBtn = t => '<button class="btn done">' + t + '</button>';
  function renderPanels(){
    const nv = VESSELS[S.vessel + 1], qc = QUALITY_COST[S.quality];
    let h = '<div class="goalcard"><div class="isl">🏭🏝️</div>' + (S.won
      ? '<h3>Industrial island acquired</h3><p>Stage 2 (Industrial Processing Hub) is not in this test build. Stage 1 keeps running so you can keep testing.</p>'
      : '<h3>Buy the industrial island</h3><p>Reach ' + fmt(ISLAND_PRICE) + ' rf to purchase the neighbouring island and unlock Stage 2.</p><button class="btn wide" data-a="island" data-cost="' + ISLAND_PRICE + '" data-cur="mvr">Buy island · ' + fmt(ISLAND_PRICE) + ' rf</button>') + '</div>';
    h += '<h2>Vessels</h2>' + row('⛵', nv ? nv.n : VESSELS[S.vessel].n,
      nv ? 'Catch x' + (nv.m / VESSELS[S.vessel].m) + ' for every boat. Current: ' + VESSELS[S.vessel].n + '.' : 'Best Stage 1 vessel. Commercial harvesters arrive in Stage 2.',
      nv ? buyBtn('vessel', '', nv.cost, 'mvr', fmt(nv.cost) + ' rf') : doneBtn('Owned'));
    h += '<h2>Quality</h2>' + row('⭐', 'Artisan quality ' + S.quality + '/' + QUALITY_COST.length, 'Coconut-husk smoking and better jars. All sale prices x1.5 per tier.',
      qc !== undefined ? buyBtn('quality', '', qc, 'mvr', fmt(qc) + ' rf') : doneBtn('Max'));
    h += '<h2>Station levels</h2><p class="note">Tap a building on the island to upgrade it. Each level lets a worker handle more per trip; output doubles every ' + MILE_STEP + ' levels and pays ' + MILE_PEARLS + ' pearls.</p>';
    $('p-upgrades').innerHTML = h;

    h = '<h2>Station staff</h2><p class="note">Staff work a station all day, so you no longer have to. You can still walk over and help anywhere.</p>';
    ORDER.forEach(id => { const s = S.st[id], d = DEF[id];
      h += row(d.ico, d.supN, 'Works at ' + d.n + ' without you.', s.auto ? doneBtn('Hired') : s.lvl < 1 ? doneBtn('Locked') : buyBtn('sup', id, d.sup, 'mvr', fmt(d.sup) + ' rf')); });
    h += '<h2>Management</h2>' + row('📋', SUPERVISOR.n, '+25% island production speed and 2-hour offline earnings.',
      S.supervisor ? doneBtn('Hired') : buyBtn('mgr', '', SUPERVISOR.cost, 'mvr', fmt(SUPERVISOR.cost) + ' rf'));
    $('p-staff').innerHTML = h;

    h = '<h2>Premium offers</h2>';
    h += row('🌟', 'Golden Maldivian Dhoni', 'Permanent x2 catch yield in Stage 1.', S.golden ? doneBtn('Owned') : buyBtn('golden', '', SHOP.golden, 'pearls', '💎 ' + SHOP.golden, 'pearl'));
    h += row('📦', 'Raw Material Crate', 'Instantly adds ' + SHOP.crateUnits + ' raw tuna.', buyBtn('crate', '', SHOP.crate, 'pearls', '💎 ' + SHOP.crate, 'pearl'));
    h += row('⏩', '2-Hour Time Warp', 'Instant +' + fmt(warpValue(2)) + ' rf (2h of staff income).', buyBtn('warp', 2, SHOP.warp2, 'pearls', '💎 ' + SHOP.warp2, 'pearl'));
    h += row('⏩', '24-Hour Time Warp', 'Instant +' + fmt(warpValue(24)) + ' rf (24h of staff income).', buyBtn('warp', 24, SHOP.warp24, 'pearls', '💎 ' + SHOP.warp24, 'pearl'));
    h += '<h2>Free boost</h2>' + row('🌶️', 'Lonumirus spice rush', 'Everyone works x2 faster for ' + BOOST_SECS + 's. Rewarded ad (simulated).', '<button class="btn ad" data-a="adBoost" id="adBtn">▶ Watch</button>');
    h += '<h2>Pearl store</h2><p class="note">Test build: purchases are simulated and free, so you can try every offer.</p>';
    BUNDLES.forEach(b => { h += row('💎', fmt(b[0]) + ' Pearls', 'Store price ' + b[1] + ' rf.', '<button class="btn pearl" data-a="iap" data-v="' + b[0] + '">Get (test)</button>'); });
    $('p-shop').innerHTML = h;
    dirty = false;
  }

  /* ---- per-frame interface refresh ---- */
  function hint(){
    const st = S.st, I = S.inv, cap = qty('dhoni');
    if (S.inBoat){
      if (S.fishing) return '🎣 Fishing… ' + fmt(Math.floor(S.hold)) + ' / ' + fmt(cap) + ' tuna in the hold. Stay over the shoal.';
      if (S.hold >= cap) return '⚓ Hold is full (' + fmt(cap) + ' tuna). Sail back to the jetty to land the catch.';
      return '⛵ Steer out to the fishing ground under the seabirds.' + (S.hold >= 1 ? ' Hold: ' + fmt(Math.floor(S.hold)) + ' / ' + fmt(cap) + '.' : '');
    }
    if (S.won) return 'Stage 1 complete. The island keeps earning.';
    if (S.trips === 0) return '🕹️ Drag anywhere to walk. Go down the jetty and step onto your dhoni at the white circle.';
    if (!unlocked('cut')) return S.mvr >= DEF.cut.unlock ? '🔪 Tap the Cutting plot and build it. Loins sell for ' + DEF.cut.val + ' rf.' : 'Raw tuna sells for ' + DEF.dhoni.val + ' rf. Fish again and save ' + DEF.cut.unlock + ' rf for the Cutting Station.';
    if (S.heroZone){ const w = st[S.heroZone].w[1]; return w.run ? '💪 Working at ' + DEF[S.heroZone].n + '. Stay in the circle to keep going.' : 'Nothing left to process here. ' + (st.dhoni.auto ? 'Help another station or go fishing.' : 'Go fishing for more tuna.'); }
    const afford = ORDER.find(id => unlocked(id) && !st[id].auto && S.mvr >= DEF[id].sup);
    if (afford) return '👨‍🍳 You can hire a ' + DEF[afford].supN + '. Tap ' + DEF[afford].n + ', then Hire.';
    const next = ORDER.find(id => !unlocked(id));
    if (next && S.mvr >= DEF[next].unlock) return '🏗️ You can build ' + DEF[next].n + '. Tap its plot on the island.';
    const stock = {cut:I.tuna >= 1, smoke:I.loin >= 1, pot:I.broth >= BROTH_PER_RIHA};
    const mine = ['pot', 'smoke', 'cut'].find(id => unlocked(id) && !st[id].auto && stock[id]);
    if (mine) return '👣 Stock is waiting at ' + DEF[mine].n + '. Walk into its white circle to work it.';
    if (!st.dhoni.auto) return '⛵ Walk to the end of the jetty and take the dhoni out again.';
    const slow1 = ['cut', 'smoke', 'pot'].find(id => unlocked(id) && stock[id] && ((id === 'cut' && I.tuna > qty('cut') * 4) || (id === 'smoke' && I.loin > qty('smoke') * 4) || (id === 'pot' && I.broth > qty('pot') * BROTH_PER_RIHA * 4)));
    if (slow1) return 'Stock is piling up at ' + DEF[slow1].n + '. Upgrade it, or walk over and help.';
    if (next) return 'Next: ' + DEF[next].n + ' at ' + fmt(DEF[next].unlock) + ' rf. Your staff keep working; you can fish or help a station.';
    return 'Goal: ' + fmt(ISLAND_PRICE) + ' rf to buy the industrial island (Upgrades tab).';
  }
  let slow = 0;
  function refresh(){
    set('h-mvr', fmt(S.mvr)); set('h-pearl', fmt(S.pearls)); set('h-rate', fmt(income(false)));
    const bs = Math.ceil((S.boostUntil - now()) / 1000);
    $('h-boost').classList.toggle('on', bs > 0); if (bs > 0) set('h-boost', '🌶️ x2 ' + bs + 's');
    if (tab !== 'island') { if (++slow % 12 === 0) slowRefresh(); return; }

    ORDER.forEach(id => {                                             // tags over buildings + chips
      const s = S.st[id], t = tagEl[id], p = screenPos[id], lock = s.lvl < 1;
      if (p){ t.style.left = p.x + 'px'; t.style.top = p.y + 'px'; t.style.display = ''; } else t.style.display = 'none';
      const txt = lock ? '🔒 ' + fmt(DEF[id].unlock) + ' rf' : DEF[id].ico + ' Lv ' + s.lvl;
      if (t.textContent !== txt) t.textContent = txt;
      t.classList.toggle('sel', sel === id); t.classList.toggle('lock', lock && S.mvr < DEF[id].unlock); t.classList.toggle('can', lock && S.mvr >= DEF[id].unlock);
      const c = $('ch-' + id); c.classList.toggle('sel', sel === id); c.classList.toggle('locked', lock);
      set('cl-' + id, lock ? '🔒 ' + fmt(DEF[id].unlock) : 'Lv ' + s.lvl);
      set('cb-' + id, (s.auto ? '👷' : '') + (heroOn(id) ? '🧑‍🌾' : ''));
    });
    for (const k in infoTag){ const p = screenPos[k], e = infoTag[k], show = p && (k === 'board' ? !S.inBoat : S.inBoat) && p.y > 30 && p.y < (T3 ? T3.H : 0) + 10; e.style.display = show ? '' : 'none'; if (show){ e.style.left = p.x + 'px'; e.style.top = p.y + 'px'; } }
    const s = S.st[sel], d = DEF[sel], up = $('d-up'), hire = $('d-hire'), work = $('d-work');
    set('d-name', d.n);
    if (s.lvl < 1){
      set('d-lv', 'Not built'); set('d-flow', 'Makes ' + d.out + ' worth ' + d.val + ' rf each.'); set('d-crew', 'Build it to add this step to your island.');
      set('d-ul', 'Build'); set('d-uc', fmt(d.unlock) + ' rf'); up.classList.toggle('no', S.mvr < d.unlock);
      hire.style.display = work.style.display = 'none';
    } else {
      const b = bulk(sel);
      set('d-lv', 'Lv ' + s.lvl + ' · x2 at ' + nextMile(s.lvl)); set('d-flow', flow(sel)); set('d-crew', crew(sel));
      set('d-ul', 'Upgrade x' + b.n); set('d-uc', fmt(b.cost) + ' rf'); up.classList.toggle('no', S.mvr < b.cost);
      hire.style.display = work.style.display = '';
      hire.classList.toggle('off', s.auto); hire.classList.toggle('no', !s.auto && S.mvr < d.sup);
      set('d-hl', s.auto ? d.supN : 'Hire ' + d.supN.split(' (')[0]); set('d-hc', s.auto ? 'Hired ✓' : fmt(d.sup) + ' rf');
      const here = heroOn(sel);
      work.classList.toggle('off', here); set('d-wk', here ? 'Working here ✓' : (sel === 'dhoni' ? 'Board at the jetty' : 'Walk to the circle'));
    }
    if (++slow % 12 === 0) slowRefresh();
  }
  function slowRefresh(){
    const cur = {mvr:S.mvr, pearls:S.pearls};
    document.querySelectorAll('.panel.on [data-cost]').forEach(b => b.classList.toggle('no', cur[b.dataset.cur] < +b.dataset.cost));
    set('h-hint', hint());
    $('h-goal').style.width = (S.won ? 100 : Math.min(100, S.mvr / ISLAND_PRICE * 100)) + '%';
    set('h-goaltx', S.won ? 'Stage 2 unlocked' : 'Goal ' + fmt(S.mvr) + ' / ' + fmt(ISLAND_PRICE) + ' rf');
    if (tab === 'shop'){ const a = $('adBtn'); if (a){ const w = Math.max(0, Math.ceil((S.adReadyAt - now()) / 1000)); a.textContent = w ? fmtTime(w) : '▶ Watch'; a.classList.toggle('no', w > 0); } }
    const navs = document.querySelectorAll('nav button');
    navs[1].classList.toggle('alert', tab !== 'upgrades' && ((!S.won && S.mvr >= ISLAND_PRICE) || (VESSELS[S.vessel+1] && S.mvr >= VESSELS[S.vessel+1].cost) || (QUALITY_COST[S.quality] !== undefined && S.mvr >= QUALITY_COST[S.quality])));
    navs[2].classList.toggle('alert', tab !== 'staff' && (ORDER.some(id => unlocked(id) && !S.st[id].auto && S.mvr >= DEF[id].sup) || (!S.supervisor && S.mvr >= SUPERVISOR.cost)));
  }

  /* ---- modals ---- */
  function modal(html){ $('mbox').innerHTML = html; $('modal').classList.add('on'); }
  function closeModal(){ $('modal').classList.remove('on'); }
  function showAd(done){
    let n = 3; modal('<div class="e">📺</div><h3>Rewarded ad (simulated)</h3><p>A real build plays a video here.</p><div class="amt" id="adN">3</div>');
    const iv = setInterval(() => { n--; const e = $('adN'); if (e) e.textContent = n; if (n <= 0){ clearInterval(iv); closeModal(); done(); } }, 1000);
  }
  let pendingOffline = 0;
  function welcomeBack(secs){
    const v = offlineEarnings(secs);
    if (v > 0){ pendingOffline = v;
      modal('<div class="e">🌙</div><h3>Welcome back</h3><p>Your staff worked for ' + fmtTime(Math.min(secs, SUPERVISOR.offlineCap)) + ' while you were away.</p><div class="amt">+' + fmt(v) + ' rf</div>' +
        '<button class="btn ad wide" data-a="offAd">▶ Watch ad: collect x2</button><button class="btn wide" data-a="offCollect">Collect</button>');
    } else if (secs >= OFFLINE_MIN && !S.supervisor && S.sold > 0) toast('Hire the Island Supervisor to earn while you are away.');
  }
  function winModal(){ modal('<div class="e">🏭🎉</div><h3>Island acquired!</h3><p>You bought the industrial island. Stage 2, the Industrial Processing Hub, starts here in the full game.</p><button class="btn wide" data-a="close">Keep playing Stage 1</button>'); }
  function settingsModal(){ resetArmed = 0;
    modal('<div class="e">⚙️</div><h3>Stats and save</h3><div class="stats">Lifetime earnings <b>' + fmt(S.total) + ' rf</b><br>Fishing trips <b>' + fmt(S.trips) + '</b><br>Units sold <b>' + fmt(S.sold) + '</b><br>Staff income (idle) <b>' + fmt(income(true, true)) + ' rf/s</b><br>Income with you <b>' + fmt(income(false, true)) + ' rf/s</b></div>' +
      '<p>Progress saves in this browser every 10 seconds.</p><button class="btn wide" data-a="close">Close</button><button class="btn done wide" data-a="reset">Reset progress</button>'); }

  /* ---- input ---- */
  function switchTab(t){ tab = t; document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === t)); renderPanels(); slow = 11; }
  function syncMode(){ document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x.dataset.v === String(S.mode))); }
  const poor = cur => toast(cur === 'pearls' ? 'Not enough pearls.' : 'Not enough rf yet.');
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (!b){                                                          // tap on the island: pick the nearest building
      const view = $('view'); if (!view.contains(e.target) || tab !== 'island') return; if (dragMoved > 10) return;
      const r = view.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; let best = null, bd = 90;
      ORDER.forEach(id => { const p = screenPos[id]; if (!p) return; const d = Math.hypot(p.x - x, p.y + 45 - y); if (d < bd){ bd = d; best = id; } });
      if (best) sel = best; return;
    }
    const a = b.dataset.a, v = b.dataset.v;
    switch (a){
      case 'sel': sel = v; break;
      case 'up': if (!buyLevel(sel) && S.st[sel].lvl > 0) poor(); break;
      case 'sup': { const id = v || sel; if (S.st[id].auto) break; hireStaff(id) || poor(); break; }
      case 'work': toast(sel === 'dhoni' ? 'Drag to walk: go to the end of the jetty and step onto your dhoni.' : 'Drag to walk your fisherman into the white circle at ' + DEF[sel].n + '.'); break;
      case 'mode': S.mode = v; syncMode(); break;
      case 'tab': switchTab(v); break;
      case 'mgr': hireSupervisor() || poor(); break;
      case 'vessel': buyVessel() || poor(); break;
      case 'quality': buyQuality() || poor(); break;
      case 'golden': buyGolden() || poor('pearls'); break;
      case 'crate': buyCrate() || poor('pearls'); break;
      case 'warp': if (S.pearls < (+v === 2 ? SHOP.warp2 : SHOP.warp24)) poor('pearls'); else buyWarp(v); break;
      case 'adBoost': if (now() < S.adReadyAt) toast('Next spice rush in ' + fmtTime((S.adReadyAt - now()) / 1000)); else showAd(() => { startBoost(); toast('🌶️ Spice rush! x2 speed for ' + BOOST_SECS + 's'); }); break;
      case 'iap': S.pearls += +v; dirty = true; toast('+' + v + ' pearls (test purchase)'); break;
      case 'island': if (buyIsland()) winModal(); else toast('You need ' + fmt(ISLAND_PRICE) + ' rf.'); break;
      case 'offCollect': S.mvr += pendingOffline; S.total += pendingOffline; pendingOffline = 0; closeModal(); break;
      case 'offAd': { const p = pendingOffline * 2; pendingOffline = 0; showAd(() => { S.mvr += p; S.total += p; toast('+' + fmt(p) + ' rf'); }); break; }
      case 'settings': settingsModal(); break;
      case 'close': closeModal(); break;
      case 'reset':
        if (resetArmed){ S = fresh(); resetArmed = 0; sel = 'dhoni'; save(); closeModal(); switchTab('island'); syncMode(); toast('Progress reset.'); }
        else { resetArmed = 1; b.textContent = 'Tap again to erase everything'; }
        break;
    }
    if (dirty) renderPanels();
  });

  /* ---- main loop ---- */
  let last = performance.now();
  function frame(t){
    let dt = (t - last) / 1000; last = t;
    if (dt > OFFLINE_MIN){ welcomeBack(dt); dt = 0; }                 // tab was hidden for a while
    dt = Math.min(dt, 30);
    while (dt > 0){ const d = Math.min(0.1, dt); step(d); dt -= d; }
    if (tab === 'island') render3D(t / 1000);
    refresh();
    requestAnimationFrame(frame);
  }
  const had = load();
  init3D(); syncMode(); renderPanels();
  if (had) welcomeBack((Date.now() - S.last) / 1000);
  setInterval(save, 10000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
